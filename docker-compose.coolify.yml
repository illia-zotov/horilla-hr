# Self-contained production Compose file for Coolify.
#
# Routing: Coolify's Traefik terminates TLS and forwards plain HTTP to nginx:80.
# The route is declared by the bare `SERVICE_URL_NGINX_80` entry in the nginx
# service below -- that single magic variable is what tells Coolify which
# container to publish and on which port. `web` deliberately has no
# SERVICE_FQDN_*/SERVICE_URL_* of its own: two published services in one stack
# is exactly what makes Traefik and nginx fight over the domain.
#
# Nginx stays the HTTP entrypoint because it serves /static/ and proxies
# protected media requests to Django. It never binds a host port (`expose`,
# not `ports`), so it cannot collide with Traefik on :80/:443.
#
# Secrets: use the bare "${VAR:?}" form for anything mandatory. Coolify marks
# such variables required and blocks the deployment while they are empty.
# Never write "${VAR:?some message}" -- Coolify treats the text after ":?" as a
# PREFILLED DEFAULT VALUE, not an error message, so the stack would happily boot
# with a secret whose value is a string committed to this repository.
#
# No repository-local .env file is required.

services:
  web:
    build: .
    expose:
      - "8000"
    environment:
      DEBUG: "0"
      HORILLA_ENV: production
      DB_HOST: db
      # python -c "from django.core.management.utils import get_random_secret_key; print(get_random_secret_key())"
      SECRET_KEY: ${SECRET_KEY:?}
      # The generated domain comes from nginx's SERVICE_URL_NGINX_80 declaration;
      # ${SERVICE_FQDN_NGINX} is the bare host, ${SERVICE_URL_NGINX} the full URL
      # with scheme -- which is exactly what each Django setting expects.
      # localhost/127.0.0.1 are required by the container healthchecks: with
      # DEBUG=0 Django does not whitelist them automatically, and CommonMiddleware
      # answers the probe with 400 DisallowedHost if they are missing.
      ALLOWED_HOSTS: ${SERVICE_FQDN_NGINX},localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: ${SERVICE_URL_NGINX}
      DATABASE_URL: postgres://${POSTGRES_USER:-horilla_user}:${SERVICE_PASSWORD_POSTGRES}@db:5432/${POSTGRES_DB:-horilla_db}
      # Password typed into the "load demo data" form in base/views.py -- it has
      # to be a value you choose and remember, not a generated one.
      DB_INIT_PASSWORD: ${DB_INIT_PASSWORD:?}
      REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
      # Production settings already force Secure session/CSRF cookies, so this
      # stack is HTTPS-only anyway. Set to 0 only if you serve it over plain HTTP.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      TIME_ZONE: ${TIME_ZONE:-Europe/Kyiv}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 30s
      start_period: 60s
      retries: 3

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-horilla_db}
      POSTGRES_USER: ${POSTGRES_USER:-horilla_user}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # $$ keeps Compose from interpolating: the shell inside the container
      # expands these, so the probe always matches the credentials the container
      # actually received, even after POSTGRES_USER/DB are changed in the UI.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # SERVICE_PASSWORD_* values are generated symbol-free, so they stay safe to
    # embed unescaped in REDIS_URL above.
    command: redis-server --appendonly yes --requirepass ${SERVICE_PASSWORD_REDIS}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SERVICE_PASSWORD_REDIS}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    environment:
      # The only published service in this stack. Bare (no "=value") on purpose:
      # this form asks Coolify to generate the domain AND point Traefik at
      # port 80 of this container. Consume it elsewhere as ${SERVICE_FQDN_NGINX}
      # / ${SERVICE_URL_NGINX} -- without the port suffix, which would otherwise
      # be appended to the value.
      - SERVICE_URL_NGINX_80
    expose:
      - "80"
    volumes:
      # Static only -- /media/ is proxied to Django (protected_media). Do not
      # mount the media volume here; an alias location would bypass auth.
      - staticfiles:/static:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      # End-to-end: nginx -> web. Relies on 127.0.0.1 being in ALLOWED_HOSTS.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3

volumes:
  staticfiles:
  media:
  postgres_data:
  redis_data:
