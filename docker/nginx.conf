events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Security
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    # When this stack runs behind another reverse proxy that terminates TLS
    # (Coolify's Traefik, a cloud LB), $scheme here is always "http" -- the
    # outer proxy speaks plain HTTP to us. Overwriting X-Forwarded-Proto with
    # $scheme would therefore hide HTTPS from Django: SECURE_PROXY_SSL_HEADER
    # would never match, request.is_secure() would stay False, absolute URLs
    # would come out as http://, and with SECURE_SSL_REDIRECT on the client
    # would bounce in an endless redirect loop. Pass the outer proxy's value
    # through, and fall back to $scheme only when nginx is the outermost hop
    # (plain `docker compose` runs with no Traefik in front).
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream django {
        server web:8000;
    }

    server {
        listen 80;
        client_max_body_size 50M;

        # No security headers at server level: Django already sets
        # X-Content-Type-Options, X-Frame-Options and Referrer-Policy on every
        # proxied response (see horilla/settings/security.py). nginx's
        # add_header appends instead of replacing, and a duplicated
        # X-Frame-Options is treated as DENY by some browsers, which would
        # break every legitimately framed view. They are set on /static/
        # instead, where no Django response passes through.

        location /static/ {
            alias /static/;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            access_log off;
        }

        # /media/ is intentionally NOT served directly by nginx. Every file under
        # it requires Django's own per-request checks -- authentication (or a
        # valid JWT) and the content-type gate that forces uploaded HTML/SVG/XML/JS
        # to download instead of rendering inline. Serving it here via `alias`
        # would bypass both checks entirely, regardless of what Django itself
        # enforces in base/views.py:protected_media(). Requests fall through to
        # the proxy below instead.

        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }
    }
}
